<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO · Property Manager – Rental & Landlord Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --a:#8a6a4f;--a2:#c9a98b;--a3:#f6efe8;--ink:#14212e;--ink2:#3d4d5c;--mut:#6b7a89;
  --bg:#f8f5f1;--card:#ffffff;--card2:#f7f9fb;--line:#dfe6ec;--good:#1f8a5b;--warn:#c98a12;--bad:#c2413b;
  --light:#ffd36b;--sky1:#c9a98b;--sky2:#8a6a4f;
  --font:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
[data-theme="orchid"]{--a:#1E1A2D;--a2:#B98AAE;--a3:#F6E9F2;--sky1:#E3BDD8;--sky2:#1E1A2D;--bg:#FBF5F9;--card2:#F8EFF5;--line:#EBDCE6}
[data-dark="1"][data-theme="orchid"]{--bg:#141220;--card:#1E1A2D;--card2:#262138;--line:#342D48;--a:#E3BDD8;--a2:#E3BDD8;--a3:#2D2740}
[data-theme="orchid"]{--light:#E3BDD8}[data-theme="orchid"] .u.on{color:#1E1A2D}[data-theme="orchid"] .side{background:#1E1A2D}
[data-theme="lavender"]{--a:#645A7B;--a2:#AB94C0;--a3:#efe8f5;--sky1:#AB94C0;--sky2:#645A7B;--bg:#FDF2E3;--card2:#fbf6ef;--line:#eadfd3}
[data-dark="1"][data-theme="lavender"]{--bg:#17141c;--card:#211d28;--card2:#2a2532;--line:#352f3f;--a3:#2c2637}
[data-theme="sand"]{--a:#8a6a4f;--a2:#c9a98b;--a3:#f6efe8;--sky1:#c9a98b;--sky2:#8a6a4f}
[data-theme="latte"]{--a:#7a5c48;--a2:#b89a83;--a3:#f3ece6;--sky1:#b89a83;--sky2:#7a5c48}
[data-theme="blush"]{--a:#9a5f5f;--a2:#d4a5a0;--a3:#f8ecea;--sky1:#d4a5a0;--sky2:#9a5f5f}
[data-theme="clay"]{--a:#9b6048;--a2:#cf9a80;--a3:#f7ebe4;--sky1:#cf9a80;--sky2:#9b6048}
[data-theme="olive"]{--a:#6b6a4c;--a2:#a8a580;--a3:#f1f0e7;--sky1:#a8a580;--sky2:#6b6a4c}
[data-theme="mocha"]{--a:#5e4a40;--a2:#9a8478;--a3:#efe9e5;--sky1:#9a8478;--sky2:#5e4a40}
[data-theme="stone"]{--a:#6e6a63;--a2:#aaa49a;--a3:#f1efec;--sky1:#aaa49a;--sky2:#6e6a63}
[data-theme="mauve"]{--a:#7b5f6e;--a2:#b89aab;--a3:#f4ecf0;--sky1:#b89aab;--sky2:#7b5f6e}
[data-dark="1"]{--ink:#eef2f6;--ink2:#c3ccd5;--mut:#8e9aa6;--bg:#11161c;--card:#1a2129;--card2:#212a33;--line:#2c3742;--a3:#24303b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--a);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:22px 20px;display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;line-height:1.15}
.brand svg{flex-shrink:0}.brand .logo-badge{flex-shrink:0;width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}.brand .logo-badge img{width:34px;height:34px;border-radius:8px;display:block}
.brand small{display:block;font-weight:500;font-size:11.5px;opacity:.75}
.nav{flex:1;overflow:auto;padding:4px 12px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#fff;opacity:.82;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.1);opacity:1}
.nav button.on{background:#fff;color:var(--a);opacity:1;font-weight:700}
[data-dark="1"] .nav button.on{color:#1E1A2D}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.nav h6{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;padding:14px 12px 4px;font-weight:700}
.sidefoot{padding:14px 20px;font-size:11.5px;opacity:.7}
.main{flex:1;min-width:0;padding:26px 32px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.top p{color:var(--mut);font-size:13.5px}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.bad{background:var(--bad);color:#fff}
.btn.good{background:var(--good);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12)}
.cal{border-collapse:separate;border-spacing:4px}.cal td.c{width:44px;height:30px;border-radius:7px;text-align:center;font-size:11px;font-weight:700;color:#fff}.cal .paid{background:var(--good)}.cal .partial{background:var(--warn)}.cal .overdue{background:var(--bad)}.cal .upcoming{background:var(--a2);opacity:.55}.cal .none{background:var(--card2);color:var(--mut)}
.fc{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px;overflow-x:auto}.fc .c{flex:1 0 64px;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.fc .b{width:100%;border-radius:6px 6px 0 0;background:var(--a2)}.fc .b.neg{background:var(--bad)}.fc .lab{font-size:11px;color:var(--mut)}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}
/* hero */
.hero{border-radius:22px;overflow:hidden;position:relative;color:#fff;background:var(--sky2);padding:30px 34px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end;min-height:250px}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:12px}
.hero h2{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.hero .lead{font-size:15px;opacity:.92;margin-top:10px;max-width:46ch}
.hero .chips{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.95);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:600}
[data-dark="1"] .hero .chip{background:rgba(17,22,28,.85);color:#fff}
.hero .chip b{display:block;font-size:19px;color:var(--a)}
[data-dark="1"] .hero .chip b{color:#fff}
.hero{background-size:cover;background-position:center;min-height:300px}
.occ{background:rgba(10,20,30,.55);backdrop-filter:blur(6px);border-radius:16px;padding:16px;align-self:end}
.occ .lbl{font-size:12px;font-weight:700;opacity:.85;margin-bottom:8px;display:flex;justify-content:space-between}
.occ .grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.occ .u{min-height:26px;border-radius:6px;background:rgba(255,255,255,.2);font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:3px 2px}
.occ .u.on{background:var(--light);color:#3a2a00;font-weight:700}
.banner{position:relative;overflow:hidden;border-radius:24px;color:#fff;padding:40px 36px;margin-bottom:20px;background-size:cover;background-position:center;min-height:230px;box-shadow:0 18px 40px -18px rgba(10,20,30,.55);display:flex;flex-direction:column;justify-content:flex-end}
.banner .bchg{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}.banner .bchg:hover{background:rgba(255,255,255,.3)}.banner .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700;margin-bottom:6px}.banner h1{font-size:40px;letter-spacing:-.02em;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.banner p{opacity:.9;max-width:60ch}
.pphoto{width:100%;height:170px;object-fit:cover;border-radius:12px;margin-bottom:12px;background:var(--card2)}
.win{transition:fill .4s}
/* kpi */
.kpi{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--a2);border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px -14px rgba(16,24,40,.18)}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--mut)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-good{background:#dcf3e7;color:#166c46}.p-bad{background:#fbe1df;color:#9b2c27}.p-warn{background:#fcf0d4;color:#8a5d06}.p-mut{background:var(--card2);color:var(--mut);border:1px solid var(--line)}.p-a{background:var(--a3);color:var(--a)}
[data-dark="1"] .p-good{background:#173b2a;color:#7fd6a9}[data-dark="1"] .p-bad{background:#45201e;color:#f2a29c}[data-dark="1"] .p-warn{background:#43341a;color:#f0c46a}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ib{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12.5px}
.ib:hover{border-color:var(--a2)}
.empty{text-align:center;color:var(--mut);padding:28px 12px;border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* list */
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t span{font-size:12.5px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
/* bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .b{width:42%;max-width:18px;border-radius:5px 5px 2px 2px;min-height:2px}
.bars .lab{font-size:11px;color:var(--mut)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.prog{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--a2);border-radius:999px}
/* forms */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink2)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a2);box-shadow:0 0 0 3px var(--a3)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:140px}
.top .row,.card h3 .row{flex:0 0 auto!important;flex-wrap:nowrap;gap:8px}
.top .row>*,.card h3 .row>*{flex:0 0 auto;min-width:0;width:auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{width:auto;min-width:150px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,18,26,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbg.on{display:flex}
.modal{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.mgrid .full{grid-column:1/-1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:60;font-weight:600;font-size:13.5px}
.toast.on{opacity:1;transform:translateX(-50%)}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 8px;text-align:center}
.swcell span{display:block;font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.25}
.sw{width:100%;height:46px;border-radius:14px;border:3px solid transparent;cursor:pointer;position:relative}
.sw.on{border-color:var(--ink)}
.tgl{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;margin-top:6px}
.tgl input{position:absolute;opacity:0;width:0;height:0}
.tgl .knob{width:52px;height:28px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s;box-shadow:inset 2px 2px 5px rgba(0,0,0,.15)}
.tgl .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .2s}
.tgl input:checked + .knob{background:var(--a)}
.tgl input:checked + .knob::after{left:27px}
.alert{border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13.5px;border:1px solid}
.alert.bad{background:#fdf0ef;border-color:#f3c7c3;color:#8b2a25}
.alert.warn{background:#fdf7e8;border-color:#f1dca6;color:#7a5306}
.alert.info{background:var(--a3);border-color:transparent;color:var(--a)}
[data-dark="1"] .alert.bad{background:#2e1a19;border-color:#5a2a27;color:#f2a29c}
[data-dark="1"] .alert.warn{background:#2e2716;border-color:#5a4720;color:#f0c46a}
.steps{counter-reset:s}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.receipt{border:2px dashed var(--line);border-radius:14px;padding:22px;background:var(--card2)}
.receipt h4{font-size:20px;font-weight:800;color:var(--a)}
.rline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.big{font-size:30px;font-weight:800}
.score{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:28px;margin:auto}
.score small{font-size:11px;font-weight:600;opacity:.8}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.hero h2{font-size:30px}}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}.nav{display:flex;overflow-x:auto;padding:0 10px 10px}.nav h6,.sidefoot{display:none}.nav button{white-space:nowrap;width:auto}.main{padding:18px 14px 50px}.g2,.g3,.g4,.mgrid{grid-template-columns:minmax(0,1fr)}.card h3{flex-wrap:wrap}.card{min-width:0}}
@media print{.side,.top .btn,.noprint,.toast{display:none!important}.main{padding:0}body{background:#fff}}
.nav{min-height:0}
.tbar{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 0 12px;margin:-10px 0 14px;border-bottom:1px solid var(--line)}
.tbar .sp{flex:1}
.tbar button,.tbar select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.tbar button:hover{border-color:var(--a2);color:var(--a)}
.tbar .pri{background:var(--a);color:#fff;border-color:var(--a)}
.tbar .tsw{display:flex;gap:5px}.tbar .tsw i{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}.tbar .tsw i.on{box-shadow:0 0 0 2px var(--ink)}
@media print{.tbar{display:none}}
.dd{position:relative}.dd .menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px -12px rgba(40,30,20,.3);z-index:60}.dd .menu.r{left:auto;right:0}.dd.open .menu{display:block}.dd .menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px}.dd .menu button:hover{background:var(--a3)}.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.dot2{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.tbar .pri:hover,.tbar .pri{color:#fff!important;background:var(--a)}.tbar .add{font-size:14px;padding:9px 18px;box-shadow:0 6px 16px -6px var(--a)}[data-dark="1"][data-theme="orchid"] .tbar .add{color:#1E1A2D!important}
[data-dark="1"] .alert.info{color:var(--ink)}[data-dark="1"] .tbar button{color:var(--ink)}

/* ===== Claymorphism ===== */
:root{--clay-out:12px 12px 28px rgba(30,26,45,.14),-8px -8px 20px rgba(255,255,255,.85);--clay-in:inset 6px 6px 12px rgba(255,255,255,.75),inset -6px -6px 12px rgba(30,26,45,.06);--clay-dark-in:inset 6px 6px 14px rgba(255,255,255,.08),inset -8px -8px 16px rgba(0,0,0,.35)}
[data-dark="1"]{--clay-out:12px 12px 28px rgba(0,0,0,.45),-6px -6px 18px rgba(255,255,255,.03);--clay-in:inset 5px 5px 10px rgba(255,255,255,.05),inset -6px -6px 12px rgba(0,0,0,.3)}
.card,.kpi{border:0!important;border-radius:28px!important;box-shadow:var(--clay-out),var(--clay-in)!important}
.kpi{border-top:0!important;padding:20px 22px!important}
.kpi::before{content:"";display:block;width:38px;height:8px;border-radius:99px;background:var(--a2);margin-bottom:12px;box-shadow:inset 2px 2px 4px rgba(255,255,255,.5),inset -2px -2px 4px rgba(0,0,0,.12)}
.hero,.banner{border-radius:36px!important;box-shadow:14px 18px 36px rgba(30,26,45,.28),var(--clay-dark-in)!important}
.hero{min-height:420px!important;padding:48px 50px!important}
.hero h2{font-size:44px!important}.hero{grid-template-columns:1fr 1.35fr!important}.hero h2{font-size:40px!important}.hero .frame{aspect-ratio:16/9}
.hero .chip{border-radius:20px!important;box-shadow:6px 8px 16px rgba(0,0,0,.25),inset 4px 4px 8px rgba(255,255,255,.9),inset -4px -4px 8px rgba(30,26,45,.1)}
.banner{min-height:260px!important}

[data-dark="1"] .btn,[data-dark="1"] .ib,[data-dark="1"] .tbar button{box-shadow:6px 6px 14px rgba(0,0,0,.4),inset 3px 3px 6px rgba(255,255,255,.06),inset -3px -3px 6px rgba(0,0,0,.3)!important}

/* ===== Clay v2 (stronger) ===== */
:root{--clay-out:18px 22px 40px rgba(30,26,45,.22);--clay-in:inset -10px -12px 22px rgba(30,26,45,.12),inset 10px 12px 22px rgba(255,255,255,.95)}
.card,.kpi{background:var(--card)!important}
.kpi:nth-child(4n+1){background:#F6E3EF!important}.kpi:nth-child(4n+2){background:#FBE4E4!important}.kpi:nth-child(4n+3){background:#FBF0DC!important}.kpi:nth-child(4n+4){background:#E2F3EA!important}
[data-dark="1"] .kpi{background:var(--card)!important}
.card,.kpi{border-radius:34px!important}
.hero,.banner{box-shadow:20px 26px 50px rgba(30,26,45,.35),inset 10px 12px 24px rgba(255,255,255,.14),inset -14px -16px 30px rgba(0,0,0,.45)!important}
.hero .chip{border-radius:22px!important;padding:12px 18px!important;box-shadow:8px 10px 20px rgba(0,0,0,.35),inset -6px -6px 12px rgba(30,26,45,.18),inset 6px 6px 12px rgba(255,255,255,1)!important}
.btn,.ib,.tbar button{box-shadow:8px 10px 18px rgba(30,26,45,.2),inset -5px -5px 10px rgba(30,26,45,.12),inset 5px 5px 10px rgba(255,255,255,.95)!important}
.tbar .pri,.btn.pri,.btn:not(.ghost){box-shadow:8px 10px 20px rgba(30,26,45,.3),inset -5px -6px 12px rgba(0,0,0,.4),inset 5px 5px 10px rgba(255,255,255,.22)!important}
.u{border-radius:14px!important;box-shadow:4px 5px 10px rgba(0,0,0,.35),inset -3px -3px 6px rgba(0,0,0,.18),inset 3px 3px 6px rgba(255,255,255,.7)!important}
.cal td.c{border-radius:12px!important;box-shadow:3px 4px 8px rgba(30,26,45,.18),inset -3px -3px 6px rgba(0,0,0,.18),inset 3px 3px 6px rgba(255,255,255,.4)!important}
.nav button.on{box-shadow:8px 10px 20px rgba(0,0,0,.4),inset -4px -4px 8px rgba(30,26,45,.15),inset 4px 4px 8px #fff!important}
input,select,textarea{box-shadow:inset 6px 6px 12px rgba(30,26,45,.14),inset -6px -6px 12px rgba(255,255,255,.95)!important}
.kpi::before{width:46px;height:12px;box-shadow:3px 4px 8px rgba(30,26,45,.2),inset -2px -2px 4px rgba(0,0,0,.18),inset 2px 2px 4px rgba(255,255,255,.6)}

/* equal framed photos */
.banner{display:grid!important;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding:28px 28px 28px 40px!important;min-height:0!important}
.frame{position:relative;width:100%;aspect-ratio:16/10;border-radius:26px;background-color:rgba(255,255,255,.08);background-size:cover;background-position:center;box-shadow:10px 12px 24px rgba(0,0,0,.4),inset -6px -6px 14px rgba(0,0,0,.25),inset 6px 6px 14px rgba(255,255,255,.12)}
.frame .bchg{position:absolute;top:12px;right:12px;background:rgba(30,26,45,.55);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.hside .occ{width:100%!important;max-width:none!important;margin:0!important}.hside{display:flex;flex-direction:column;gap:16px}
.hero{align-items:center!important}
.card h3 .acts{flex-wrap:nowrap}.pwrap{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}
.pphoto{width:100%!important;height:auto!important;aspect-ratio:16/10;object-fit:cover;border-radius:22px!important;margin:0!important;box-shadow:8px 10px 20px rgba(30,26,45,.2)}
.pph-empty{aspect-ratio:16/10;border-radius:22px;background:var(--a3);display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;font-size:13px;box-shadow:inset 5px 5px 12px rgba(30,26,45,.1),inset -5px -5px 12px rgba(255,255,255,.8);cursor:pointer}
@media(max-width:760px){.banner{grid-template-columns:1fr;padding:24px!important}.pwrap{grid-template-columns:1fr}}

/* full-background photos */
.hero,.banner{position:relative}
.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)!important;min-height:460px!important;align-items:end!important}
.hero .bchg,.banner .bchg{position:absolute;top:18px;right:18px;z-index:2;background:rgba(30,26,45,.6);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:7px 15px;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.glass{background:rgba(30,26,45,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;padding:28px 30px;box-shadow:10px 14px 30px rgba(0,0,0,.3),inset 4px 4px 10px rgba(255,255,255,.12),inset -6px -6px 14px rgba(0,0,0,.3)}
.hero .occ.glass{padding:20px 22px}
.banner{display:flex!important;align-items:flex-end!important;justify-content:flex-start!important;flex-direction:row!important;min-height:320px!important;padding:30px!important}
.banner .glass{max-width:620px}
@media(max-width:760px){.hero{grid-template-columns:1fr!important}.banner{min-height:260px!important}}

.hero,.banner{overflow:visible!important}.addwrap .menu{z-index:80}.banner.plain .addwrap .menu{left:auto;right:0}.banner.plain{background:var(--sky2)!important;min-height:200px!important;align-items:center!important;justify-content:space-between!important;padding:36px 40px!important;gap:20px}
.banner.plain .btxt{max-width:680px}
.addwrap .add{background:var(--sky1)!important;color:#1E1A2D!important;font-weight:800!important;font-size:15px!important;padding:14px 26px!important;border:0;border-radius:20px!important;cursor:pointer;box-shadow:8px 10px 22px rgba(0,0,0,.35),inset -5px -5px 10px rgba(30,26,45,.18),inset 5px 5px 10px rgba(255,255,255,.7)!important}
.hero .addwrap{margin-top:18px;display:inline-block}
.addwrap .menu{color:var(--ink)}
.tbtn{padding:7px 12px!important;font-size:12px!important}
.tbtn .dot2{width:11px;height:11px;margin-right:4px}
@media(max-width:760px){.banner.plain{flex-direction:column!important;align-items:flex-start!important}}

.nav button{padding-top:8px!important;padding-bottom:8px!important;margin-bottom:1px!important}.nav h6{margin-top:10px!important}
.tw td:first-child{white-space:nowrap}

.demobar{position:sticky;top:0;z-index:200;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;background:#E3BDD8;color:#1E1A2D;padding:9px 16px;font-size:13.5px;box-shadow:0 6px 16px rgba(30,26,45,.18)}
.demobar b{letter-spacing:.12em;font-size:12px;background:#1E1A2D;color:#E3BDD8;padding:4px 10px;border-radius:999px}
.demobar a{background:#1E1A2D;color:#fff;text-decoration:none;font-weight:700;padding:7px 16px;border-radius:14px;box-shadow:4px 5px 10px rgba(30,26,45,.3),inset 2px 2px 4px rgba(255,255,255,.2)}
.demowm{position:fixed;right:24px;bottom:18px;z-index:150;font-weight:800;font-size:56px;letter-spacing:.2em;color:#1E1A2D;opacity:.06;pointer-events:none;transform:rotate(-8deg)}
.dmbg{position:fixed;inset:0;z-index:300;background:rgba(20,16,30,.55);display:none;align-items:center;justify-content:center;padding:16px}.dmbg.on{display:flex}
.dm{background:#fff;color:#1E1A2D;max-width:460px;width:100%;border-radius:30px;padding:28px;box-shadow:20px 24px 50px rgba(30,26,45,.35),inset 5px 5px 12px rgba(255,255,255,.8),inset -6px -6px 14px rgba(30,26,45,.08)}
.dm h3{font-size:22px;margin:8px 0}.dm p{color:#5d5670;font-size:14px}.dm ul{margin:14px 0 20px 18px;font-size:14px;line-height:1.8}
.dmtag{display:inline-block;background:#F6E9F2;color:#1E1A2D;font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:999px}
.dmrow{display:flex;gap:10px;justify-content:flex-end}.dmrow .btn{flex:0 0 auto;text-decoration:none}
.tbar{top:38px!important}.side{top:38px!important;height:calc(100vh - 38px)!important}
@media(max-width:760px){.side{top:0!important;height:auto!important}.demobar{font-size:12px}.demowm{font-size:36px}}
</style>

<script>
"use strict";
const $=s=>document.querySelector(s);
const KEY='pm.landlord.v1';
const NAV=[['dashboard','Dashboard',''],['properties','Properties & Units',''],['tenants','Tenants & Leases',''],['rent','Rent Tracker',''],['calendar','Rent Calendar',''],['forecast','Cash-flow Forecast',''],['expenses','Expenses',''],['maintenance','Maintenance',''],['reports','Reports & ROI',''],['tools','Landlord Tools',''],['settings','Settings',''],['guide','How to Use','']];

const EXP_CATS=['Mortgage','Property Tax','Insurance','Repairs','Utilities','HOA / Service Charge','Management Fee','Cleaning','Landscaping','Advertising','Legal & Professional','Supplies','Other'];
const THEMES=[["orchid","#1E1A2D","Midnight Orchid"],["lavender","#645A7B","Lavender Linen"],["sand", "#8a6a4f", "Sand"], ["latte", "#7a5c48", "Latte"], ["blush", "#9a5f5f", "Blush"], ["clay", "#9b6048", "Clay"], ["olive", "#6b6a4c", "Olive"], ["mocha", "#5e4a40", "Mocha"], ["stone", "#6e6a63", "Stone"], ["mauve", "#7b5f6e", "Mauve"]];
const PH=id=>'https://images.unsplash.com/photo-'+id+'?auto=format&fit=crop&w=1600&q=70';
const IMG={dashboard:PH('1760894492960-5b0a2da0676d'),properties:PH('1629257668721-9872756e6266'),tenants:PH('1733244766159-f58f4184fd38'),rent:PH('1722487631997-cf1e0f92c2c4'),expenses:PH('1707779491435-000c45820db2'),maintenance:PH('1756027583186-a04a19e4f6ce'),reports:PH('1743147962240-8f8c18cc7471'),tools:PH('1584677191047-38f48d0db64e'),calendar:PH('1722487631997-cf1e0f92c2c4'),forecast:PH('1743147962240-8f8c18cc7471'),settings:PH('1629257668721-9872756e6266'),guide:PH('1733244766159-f58f4184fd38')};
let S, view='dashboard', rentMonth=ym(new Date()), repYear=new Date().getFullYear(), filt={};
function uid(){return Math.random().toString(36).slice(2,10)}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addM(m,n){const[y,mo]=m.split('-').map(Number);return ym(new Date(y,mo-1+n,1))}
function addMDate(d,n){const[y,m,da]=d.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(da,last)).padStart(2,'0')}
function mLabel(m){const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString(undefined,{month:'short',year:'numeric'})}
function dLabel(d){if(!d)return '—';const[y,m,da]=d.split('-').map(Number);return new Date(y,m-1,da).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function days(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){const c=S.settings.currency;return (n<0?'-':'')+c+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function blank(){return{settings:{name:'',currency:'$',theme:'orchid',dark:0,lateType:'flat',lateFee:50,grace:5,remind:60,cc:'+1',fcFill:'',receiptSeq:0,fcRenew:1},properties:[],units:[],tenants:[],payments:[],expenses:[],maint:[],sample:0}}
function load(){try{S=null}catch(e){}if(!S){S=sample()}S.settings=Object.assign(blank().settings,S.settings||{});for(const k of['properties','units','tenants','payments','expenses','maint'])S[k]=S[k]||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ---------- lookups ---------- */
const prop=id=>S.properties.find(p=>p.id===id), unit=id=>S.units.find(u=>u.id===id), ten=id=>S.tenants.find(t=>t.id===id);
const unitProp=u=>u&&prop(u.propertyId);
const tenProp=t=>t&&unitProp(unit(t.unitId));
function activeIn(t,m){const s=m+'-01',e=addM(m,1)+'-01';return t.leaseStart<e&&(!t.leaseEnd||t.leaseEnd>s)&&!t.movedOut}
function curTenant(uId){const m=ym(new Date());return S.tenants.find(t=>t.unitId===uId&&activeIn(t,m))}
function paidFor(tId,m){return S.payments.filter(p=>p.tenantId===tId&&p.period===m&&p.kind!=='fee').reduce((a,p)=>a+ +p.amount,0)}
function feePaid(tId,m){return S.payments.filter(p=>p.tenantId===tId&&p.period===m&&p.kind==='fee').reduce((a,p)=>a+ +p.amount,0)}
function dueDate(t,m){const[y,mo]=m.split('-').map(Number);const last=new Date(y,mo,0).getDate();return m+'-'+String(Math.min(+t.dueDay||1,last)).padStart(2,'0')}
function lateFee(t){return S.settings.lateType==='pct'?Math.round(t.rent*S.settings.lateFee/100):+S.settings.lateFee}
function status(t,m){const paid=paidFor(t.id,m),due=+t.rent;const dd=dueDate(t,m);const late=days(dd,today())>+S.settings.grace;
  if(paid>=due)return{k:'paid',paid,due,bal:0,fee:0};
  const fee=late&&+S.settings.lateFee?Math.max(0,lateFee(t)-feePaid(t.id,m)):0;
  if(paid>0)return{k:'partial',paid,due,bal:due-paid+fee,fee,dd,daysLate:late?days(dd,today()):0};
  if(late)return{k:'overdue',paid,due,bal:due-paid+fee,fee,dd,daysLate:days(dd,today())};
  return{k:'upcoming',paid,due,bal:due-paid,fee:0,dd}}
function arrears(t){let m=t.leaseStart.slice(0,7),end=ym(new Date()),tot=0,n=0;while(m<=end&&n<240){if(activeIn(t,m)){const s=status(t,m);if(s.k==='overdue'||s.k==='partial')tot+=s.bal}m=addM(m,1);n++}return tot}
function propIncome(pid,y){return S.payments.filter(p=>p.period&&p.period.startsWith(y)&&p.kind!=='fee'&&tenProp(ten(p.tenantId))?.id===pid).reduce((a,p)=>a+ +p.amount,0)}
function propExp(pid,y,excl){return S.expenses.filter(e=>e.propertyId===pid&&e.date.startsWith(y)&&(!excl||e.category!=='Mortgage')).reduce((a,e)=>a+ +e.amount,0)}
/* ---------- sample ---------- */
function sample(){const s=blank();s.sample=1;const now=new Date();const m0=ym(now);
 const P=[{id:uid(),photo:PH('1743147962240-8f8c18cc7471'),name:'Maple Court Duplex',address:'14 Maple Court',type:'Duplex',price:320000,value:365000},{id:uid(),photo:PH('1760894492960-5b0a2da0676d'),name:'Harbor View Apartments',address:'220 Harbor Rd',type:'Apartment block',price:780000,value:860000},{id:uid(),photo:PH('1629257668721-9872756e6266'),name:'Oak Street House',address:'9 Oak Street',type:'Single family',price:255000,value:290000}];
 s.properties=P;
 const U=[[0,'Unit A',2,1,1450],[0,'Unit B',2,1,1450],[1,'Apt 101',1,1,1150],[1,'Apt 102',2,1,1400],[1,'Apt 201',1,1,1180],[1,'Apt 202',2,2,1550],[1,'Apt 301',3,2,1900],[2,'Whole house',3,2,1850]].map(([p,n,b,ba,r])=>({id:uid(),propertyId:P[p].id,name:n,beds:b,baths:ba,marketRent:r}));
 s.units=U;
 const names=[['Sarah Mitchell','555-0142'],['James Okafor','555-0188'],['Priya Sharma','555-0110'],['Daniel Ruiz','555-0175'],['Emily Chen','555-0163'],['Marcus Bell','555-0121'],['Hannah Lee','555-0199']];
 const idx=[0,1,2,3,5,6,7];
 const ends=[addM(m0,5),addM(m0,1),addM(m0,8),addM(m0,2),addM(m0,10),addM(m0,0),addM(m0,7)];
 s.tenants=idx.map((ui,i)=>({id:uid(),unitId:U[ui].id,name:names[i][0],phone:names[i][1],email:names[i][0].split(' ')[0].toLowerCase()+'@mail.com',leaseStart:addM(m0,-14+i)+'-01',leaseEnd:ends[i]+'-28',rent:U[ui].marketRent,deposit:U[ui].marketRent,dueDay:1,notes:'',deductions:[]}));
 for(const t of s.tenants){for(let k=-16;k<=0;k++){const m=addM(m0,k);if(!activeIn(t,m))continue;if(k===0&&(t.name==='Daniel Ruiz'||t.name==='Marcus Bell'))continue;if(k===-1&&t.name==='Daniel Ruiz')continue;let amt=t.rent;if(k===0&&t.name==='Emily Chen')amt=800;s.payments.push({id:uid(),tenantId:t.id,period:m,amount:amt,date:m+'-0'+(2+(k+5)%5),method:['Bank transfer','Cash','Card','Cheque'][(k+9)%4],note:''})}}
 const ex=[[0,'Mortgage',1150],[1,'Mortgage',3200],[2,'Mortgage',980],[1,'Utilities',420],[0,'Insurance',95],[1,'Insurance',260],[2,'Insurance',88],[1,'Cleaning',180]];
 for(let k=-16;k<=0;k++){const m=addM(m0,k);for(const[p,c,a]of ex)s.expenses.push({id:uid(),propertyId:P[p].id,date:m+'-05',category:c,amount:a,vendor:'',note:''})}
 s.expenses.push({id:uid(),propertyId:P[1].id,date:addM(m0,-2)+'-14',category:'Repairs',amount:640,vendor:'QuickFix Plumbing',note:'Boiler valve'});
 s.expenses.push({id:uid(),propertyId:P[2].id,date:addM(m0,-1)+'-20',category:'Property Tax',amount:1350,vendor:'City council',note:'Half-year'});
 s.maint=[{id:uid(),unitId:U[3].id,title:'Leaking kitchen tap',priority:'High',status:'Open',opened:addM(m0,0)+'-03',closed:'',cost:0,vendor:'QuickFix Plumbing',notes:''},{id:uid(),unitId:U[0].id,title:'Replace hallway smoke alarm',priority:'Urgent',status:'In progress',opened:addM(m0,0)+'-01',closed:'',cost:35,vendor:'',notes:''},{id:uid(),unitId:U[7].id,title:'Gutter cleaning',priority:'Low',status:'Open',opened:addM(m0,-1)+'-18',closed:'',cost:0,vendor:'',notes:''},{id:uid(),unitId:U[5].id,title:'Repaint bedroom',priority:'Medium',status:'Done',opened:addM(m0,-2)+'-02',closed:addM(m0,-2)+'-09',cost:420,vendor:'BrightCoat Painters',notes:''}];

function building(){const units=S.units.length||6,occ=S.units.filter(u=>curTenant(u.id)).length;const cols=Math.min(4,Math.max(2,Math.ceil(Math.sqrt(units)))),rows=Math.ceil(units/cols);
 const W=46,H=36,g=12,bw=cols*W+(cols+1)*g,bh=rows*H+(rows+1)*g+40,x0=200-bw/2,y0=230-bh;let w='';
 const list=S.units.length?S.units:Array.from({length:6},()=>({}));
 list.forEach((u,i)=>{const r=Math.floor(i/cols),c=i%cols;const lit=u.id?!!curTenant(u.id):i%3!==0;w+=`<rect class="win" x="${x0+g+c*(W+g)}" y="${y0+g+r*(H+g)}" width="${W}" height="${H}" rx="4" fill="${lit?'var(--light)':'rgba(255,255,255,.18)'}"><title>${esc(u.name||'Unit')}${u.id?(lit?' – occupied':' – vacant'):''}</title></rect>`});
 return`<svg viewBox="0 0 400 240" style="width:100%;height:auto;display:block" aria-label="Building showing occupied units lit"><circle cx="330" cy="50" r="22" fill="rgba(255,255,255,.25)"/><rect x="20" y="150" width="70" height="80" rx="4" fill="rgba(255,255,255,.12)"/><rect x="315" y="120" width="65" height="110" rx="4" fill="rgba(255,255,255,.12)"/><rect x="${x0}" y="${y0}" width="${bw}" height="${bh}" rx="8" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.4)"/><rect x="${x0-8}" y="${y0-10}" width="${bw+16}" height="12" rx="4" fill="rgba(255,255,255,.35)"/>${w}<rect x="${200-14}" y="${230-34}" width="28" height="34" rx="3" fill="rgba(255,255,255,.4)"/><rect x="0" y="229" width="400" height="11" fill="rgba(0,0,0,.15)"/></svg>`}
function occBar(){const us=S.units;if(!us.length)return '<div class="lbl">Add units to see occupancy</div>';const o=us.filter(u=>curTenant(u.id)).length;return `<div class="lbl"><span>Units at a glance</span><span>${o} occupied · ${us.length-o} vacant</span></div><div class="grid8">${us.slice(0,24).map(u=>`<div class="u ${curTenant(u.id)?'on':''}" title="${esc(u.name)}">${esc(u.name)}</div>`).join('')}</div>`}

 printModal(){const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print');w.document.write(`<html><head><title>Receipt</title><style>body{font-family:Arial;padding:30px}.rline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd}.big{font-size:28px;font-weight:800}.noprint{display:none}h4{font-size:22px}</style></head><body>${$('.receipt').outerHTML}</body></html>`);w.document.close();w.print()},
 raise(){const t=ten($('#riT').value);if(!t)return toast('Choose a tenant');const pct=+$('#riP').value||0,n=+$('#riN').value||60;const nr=Math.round(t.rent*(1+pct/100));const eff=new Date();eff.setDate(eff.getDate()+n);const ed=eff.toISOString().slice(0,10);
  const u=unit(t.unitId);const mk=+u?.marketRent;const txt=`Dear ${t.name},\n\nThis letter is formal notice that the monthly rent for ${unitProp(u)?.name||''} ${u?.name||''} will increase from ${money(+t.rent)} to ${money(nr)} (${pct}%), effective ${dLabel(ed)}.\n\nAll other terms of your tenancy remain the same. Thank you for being a valued tenant.\n\nKind regards,\n${S.settings.name||'Your landlord'}`;
  $('#riOut').innerHTML=`<div class="rline"><span>New rent</span><b>${money(nr)}</b></div><div class="rline"><span>Extra per year</span><b class="good">${money((nr-t.rent)*12)}</b></div><div class="rline"><span>Effective from</span><b>${dLabel(ed)}</b></div>${mk?`<div class="rline"><span>vs market rent</span><b class="${nr>mk?'warn':'good'}">${nr>mk?money(nr-mk)+' above':money(mk-nr)+' below'}</b></div>`:''}<textarea id="cpy" class="mt" style="min-height:160px">${esc(txt)}</textarea><div class="row mt"><button class="btn sm" data-act="copy">Copy notice</button><button class="btn sm" data-act="applyRaise" data-id="${t.id}" data-rent="${nr}">Apply ${money(nr)} rent to ${esc(t.name)}</button></div>`},
 applyRaise(id,el){const t=ten(id);if(!t)return;t.rent=+el.dataset.rent;save();render();toast('Rent updated to '+money(t.rent)+' for '+t.name)},
 vacancy(){const r=+$('#vcR').value,d=+$('#vcD').value,c=+$('#vcC').value;const lost=r*12/365*d,tot=lost+c;const raise=tot/12;
  $('#vcOut').innerHTML=`<div class="rline"><span>Lost rent</span><b class="bad">${money(lost)}</b></div><div class="rline"><span>Total vacancy cost</span><b class="bad">${money(tot)}</b></div><div class="rline"><span>Equal to a rent rise of</span><b>${money(raise)} / month for a year</b></div><p class="mt" style="font-size:12.5px;color:var(--mut)">Keeping a good tenant with a smaller increase often beats ${d} empty days.</p>`},
 deposit(){const t=ten($('#dpT').value);if(!t)return toast('Choose a tenant');const ds=$('#dpD').value.split('\n').map(l=>{const i=l.lastIndexOf(',');return i>0?[l.slice(0,i).trim(),+l.slice(i+1)||0]:null}).filter(Boolean);const tot=ds.reduce((a,d)=>a+d[1],0),ref=(+t.deposit||0)-tot;t.deductions=ds.map(d=>({desc:d[0],amount:d[1]}));save();
  show(`<div class="receipt"><h4>DEPOSIT RETURN STATEMENT</h4><p style="color:var(--mut)">${esc(t.name)} · ${esc(unitProp(unit(t.unitId))?.name)} ${esc(unit(t.unitId)?.name)} · ${dLabel(today())}</p><div class="mt"><div class="rline"><span>Deposit held</span><b>${money(+t.deposit||0)}</b></div>${ds.map(d=>`<div class="rline"><span>Less: ${esc(d[0])}</span><b class="bad">−${money(d[1])}</b></div>`).join('')}</div><div class="rline" style="border:0;margin-top:8px"><span>${ref>=0?'Amount to return':'Amount tenant owes'}</span><span class="big">${money(Math.abs(ref))}</span></div></div><div class="row mt noprint"><button class="btn" data-act="printModal">Print statement</button></div>`)},
 dpLoad(){const t=ten($('#dpT').value);$('#dpD').value=t&&t.deductions?t.deductions.map(d=>d.desc+', '+d.amount).join('\n'):''},
 banner(_,b){const _v=(b&&b.dataset.v)||view;const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),w=Math.min(1400,im.width);c.width=w;c.height=im.height*w/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.settings.banners=S.settings.banners||{};S.settings.banners[_v]=c.toDataURL('image/jpeg',.7);save();render();toast('Banner photo saved')};im.src=fr.result};fr.readAsDataURL(i.files[0])};i.click()},
 fcRenew(_,el){S.settings.fcRenew=el.checked?1:0;save();render()},
 fcFill(_,el){S.settings.fcFill=el.value;save();render()},
 wa(id,b){const t=ten(id),s=status(t,b.dataset.m);const cc=String(S.settings.cc||'+1').replace(/\D/g,'');let ph=String(t.phone||'').replace(/\D/g,'');if(!ph)return toast('Add a phone number for this tenant first');if(!ph.startsWith(cc))ph=cc+ph;const tot=arrears(t);const msg=`Hi ${t.name.split(' ')[0]}, a friendly reminder that rent of ${money(s.bal)} for ${mLabel(b.dataset.m)} is now ${s.daysLate} days overdue. Total outstanding: ${money(tot)}. Please pay at your earliest convenience. Thank you, ${S.settings.name||'your landlord'}`;window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank')},
 photo(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),w=Math.min(900,im.width);c.width=w;c.height=im.height*w/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);prop(id).photo=c.toDataURL('image/jpeg',.72);save();render();toast('Photo added')};im.src=fr.result};fr.readAsDataURL(i.files[0])};i.click()},
 mode(){S.settings.dark=S.settings.dark?0:1;save();render()},upload(){$('#restore')?$('#restore').click():(go('settings'),setTimeout(()=>$('#restore').click(),50))},
 dd(_,b){const w=b.parentElement,o=w.classList.contains('open');document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));if(!o){w.classList.add('open');const m=w.querySelector('.menu');if(m){m.classList.remove('r');if(m.getBoundingClientRect().right>window.innerWidth-8){m.classList.add('r');if(m.getBoundingClientRect().left<0)m.classList.remove('r')}}}},
 qUnit(){if(!S.properties.length){toast('Add a property first');return A.addProp()}A.addUnit(S.properties[0].id)},
 qPay(){go('rent');toast('Click Record next to the tenant who paid')},
 theme(id){S.settings.theme=id;save();render()},dark(_,el){S.settings.dark=el.checked?1:0;save();render()},
 backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='property-manager-backup-'+today()+'.json';a.click();toast('Backup downloaded')},
 loadSample(){if(confirm('Replace your data with sample data?')){const st=S.settings;S=sample();S.settings=st;save();go('dashboard')}},
 clearSample(){if(confirm('Clear sample data and start fresh?')){const st=S.settings;S=blank();S.settings=st;save();go('guide');toast('Ready for your own properties')}},
 reset(){if(confirm('Erase ALL data? Download a backup first.')){const st=S.settings;S=blank();S.settings=st;save();go('dashboard')}}
};
function mtSave(o,id){const ae=o.addExp;delete o.addExp;if(o.status==='Done'&&!o.closed)o.closed=today();const old=id?S.maint.find(x=>x.id===id):null;if(ae&&+o.cost&&!(old&&old.expId)){const eid=uid();S.expenses.push({id:eid,propertyId:unitProp(unit(o.unitId))?.id,date:today(),category:'Repairs',amount:+o.cost,vendor:o.vendor,note:o.title});o.expId=eid}upsert(S.maint,o,id)}
function csv(name,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download=name;a.click();toast('CSV downloaded')}
document.addEventListener('click',e=>{if(!e.target.closest('[data-act="dd"]'))document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));const g=e.target.closest('[data-go]');if(g){close();go(g.dataset.go);return}const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT'||b.type==='checkbox')return;const f=A[b.dataset.act];if(f)f(b.dataset.id,b)});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='kind'){const mo=t.closest('#modal');const tt=ten(mo.querySelector('[name=tenantId]').value),pp=mo.querySelector('[name=period]').value;if(tt&&pp){const ss=status(tt,pp);mo.querySelector('[name=amount]').value=t.value==='fee'?ss.fee:ss.bal}}if(t.dataset.act&&A[t.dataset.act])A[t.dataset.act](null,t);if(t.dataset.f!==undefined){filt[t.dataset.f]=t.value;render()}if(t.dataset.s){S.settings[t.dataset.s]=t.type==='number'?+t.value:t.value;save();render();toast('Settings saved')}if(t.id==='restore'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.properties)throw 0;S=d;load2();save();go('dashboard');toast('Backup restored')}catch(x){toast('Not a valid backup file')}};r.readAsText(t.files[0])}});
document.addEventListener('input',e=>{if(e.target.dataset.f==='tq'){filt.tq=e.target.value;const pos=e.target.selectionStart;render();const i=document.querySelector('[data-f="tq"]');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&$('#mbg').classList.contains('on')&&e.target.tagName==='INPUT')A.save()});
$('#mbg').addEventListener('click',e=>{if(e.target.id==='mbg')close()});
function load2(){S.settings=Object.assign(blank().settings,S.settings||{});for(const k of['properties','units','tenants','payments','expenses','maint'])S[k]=S[k]||[]}
S=sample();load2();
